name: Client checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-and-android:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK components
        run: '& "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" "platforms;android-36" "build-tools;36.0.0"'
      - name: Test client and build Windows and Android packages
        run: .\gradlew.bat :shared:jvmTest :androidApp:assembleDebug :desktopApp:packageMsi --console=plain
      - name: Verify package versions and prepare demo archive
        run: .\scripts\package-demo.ps1
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-test-reports
          path: shared/build/reports/tests/jvmTest/
          retention-days: 14
      - name: Save installable demo packages
        uses: actions/upload-artifact@v7
        with:
          name: chimera-demo-windows-android
          path: |
            build/release/*.zip
            build/release/*.zip.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
